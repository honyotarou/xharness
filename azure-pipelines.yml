variables:
- template: /eng/common-variables.yml@self
- template: /eng/common/templates-official/variables/pool-providers.yml@self

# CI triggers
trigger:
  batch: true
  branches:
    include:
    - main
    - release/*
    - internal/release/*

pr: none
pr:
  branches:
    include:
    - main
    - release/*
    - internal/release/*

# Scheduled trigger - runs once per week on Sunday at midnight UTC
schedules:
- cron: '0 0 * * 0'
  displayName: Weekly build
  branches:
    include:
    - main
  always: true

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    # Immutable digest (recommended): replace refs/tags/release with the 40-char commit id returned by
    #   git ls-remote "https://<PAT>@dev.azure.com/dnceng/1ESPipelineTemplates/_git/1ESPipelineTemplates" refs/tags/release
    # Anonymous access cannot resolve the tag; dotnet/arcade also uses refs/tags/release until pinned per org policy.
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
        networkIsolationPolicy: Permissive,CFSClean,CFSClean2
    sdl:
      tsa:
        enabled: true
      policheck:
        enabled: true
      binskim:
        enabled: true
      codeql:
        ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/release/') }}:
          enabledOnNonDefaultBranches: true
    pool:
      name: $(DncEngInternalBuildPool)
      image: 1es-windows-2022
      os: windows
    stages:
    - stage: Build
      jobs:
      - template: /eng/common/templates-official/jobs/jobs.yml@self
        parameters:
          enableTelemetry: true
          enablePublishBuildArtifacts: true
          enableMicrobuild: true
          enablePublishUsingPipelines: true
          ${{ if ne(variables['Build.Reason'], 'Schedule') }}:
            enablePublishBuildAssets: true
          helixRepo: dotnet/xharness
          jobs:
          - job: Windows_NT
            displayName: Build Windows
            timeoutInMinutes: 120
            steps:
              - template: /eng/check-encapsulation.yml@self

              - script: eng\common\CIBuild.cmd -configuration $(_BuildConfig) -prepareMachine $(_InternalBuildArgs) /p:Test=false
                name: Build
                displayName: Build
                condition: succeeded()

              - template: /eng/pipelines/apiscan-steps.yml
            templateContext:
              outputs:
              - output: pipelineArtifact
                artifact: Artifacts_Windows_NT
                path: '$(Build.SourcesDirectory)\artifacts\bin\Microsoft.DotNet.XHarness.CLI'
                displayName: 'Publish Windows_NT Artifacts'
                condition: succeeded()
    - ${{ if ne(variables['Build.Reason'], 'Schedule') }}:
      - template: /eng/common/templates-official/post-build/post-build.yml@self
        parameters:
          enableSymbolValidation: true
          enableSourceLinkValidation: true
