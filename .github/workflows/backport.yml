name: Backport PR to branch
on:
  issue_comment:
    types: [created]
  schedule:
    # once a day at 13:00 UTC to cleanup old runs
    - cron: '0 13 * * *'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  backport:
    # Pinned SHA (not a branch ref) per supply-chain hardening; bump when arcade backport workflow changes.
    uses: dotnet/arcade/.github/workflows/backport-base.yml@8e46fac3b7212793291822f5cc99feeaec6f7e9e
